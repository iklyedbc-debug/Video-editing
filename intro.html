<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المقدمة: شفتاك وكأس الشاي</title>
<style>
@font-face{font-family:Cairo;src:url(fonts/cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E;}
@font-face{font-family:Cairo;src:url(fonts/cairo-latin.woff2) format('woff2');font-weight:200 1000;}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:#000;font-family:Cairo,sans-serif;color:#fff}
canvas{position:absolute;inset:0;width:720px;height:1280px}
/* identical to scene.html so the hook does not move across the cut */
#hook{position:absolute;top:120px;left:40px;right:40px;text-align:center;font-weight:800;font-size:46px;line-height:1.35;
  text-shadow:0 3px 14px rgba(0,0,0,.85),0 0 2px #000}
#hook .y{color:#ffcc66}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="432" height="768"></canvas>
  <div id="hook">إلى أي حد يمكن أن تقترب<br>شفتاك من <span class="y">كأس الشاي</span>؟</div>
</div>
<script>
const FPS = 24, DUR = 3.2, NFRAMES = Math.round(FPS * DUR);
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', {preserveDrawingBuffer:true, antialias:false});
const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS = `
precision highp float;
uniform vec2 R; uniform float uT;
uniform vec3 camP, camT;
uniform vec3 gC; uniform float gA;   // glass rim centre + tilt
const float H = 7.0;

float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h1(i),h1(i+vec2(1,0)),f.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+1.7;a*=.5;}return s;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float sdE(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}

// ---- head / lips
float dUp(vec3 p){ vec3 q=p; q.z-=.07*q.x*q.x; q.y+=.10*exp(-q.x*q.x*6.)-.04*q.x*q.x; return sdE(q-vec3(0.,.40,-.42),vec3(2.25,.46,.58)); }
float dLo(vec3 p){ vec3 q=p; q.z-=.07*q.x*q.x; q.y-=.05*q.x*q.x; return sdE(q-vec3(0.,-.46,-.50),vec3(2.0,.56,.70)); }
float dFace(vec3 p){ return sdE(p-vec3(0.,.3,6.1),vec3(5.6,8.5,6.2)); }
float dHead(vec3 p){
  float lips=min(dUp(p),dLo(p));
  float face=dFace(p);
  face=smin(face, sdE(p-vec3(0.,2.7,-.75),vec3(.8,.75,.95)),1.0);      // nose
  face=smin(face, sdE(p-vec3(0.,-3.3,.75),vec3(1.9,1.3,.95)),.9);   // chin (recessed)
  face+= .05*exp(-(p.y-1.25)*(p.y-1.25)*3.)*(1.-exp(-p.x*p.x*4.))*0.;
  float d=smin(face,lips,.32);
  float lw=smoothstep(.12,.0,lips);
  d+= lw*.012*sin(p.x*38.+3.*sin(p.y*9.));   // vertical lip lines
  d+= .006*fbm(p.xy*9.);           // skin micro relief
  return d;
}
// ---- glass (istikana): local frame, y=0 at rim, down to -H
vec3 gLocal(vec3 p){ vec3 q=p-gC; float c=cos(gA),s=sin(gA); return vec3(q.x, c*q.y - s*q.z, s*q.y + c*q.z); }
float rad(float y){ float s=clamp(-y/H,0.,1.); return 2.3-2.4*s+2.0*s*s; }
float dGlass(vec3 p){ vec3 q=gLocal(p); float r=rad(q.y);
  float d=abs(length(q.xz)-r)-.07; d=max(d,q.y); d=max(d,-H-q.y);
  float base=max(length(q.xz)-rad(-H)+.05, abs(q.y+H-.25)-.25);
  return min(d*.8,base); }
float teaLevel(){ return gC.y - 1.1; }
float dTea(vec3 p){ vec3 q=gLocal(p); float r=rad(q.y)-.09;
  float d=length(q.xz)-r; d=max(d,p.y-teaLevel()); d=max(d,-H+.5-q.y); return d*.8; }

float map(vec3 p, bool withGlass, out int m){
  float a=dHead(p); m=1; float b=dTea(p); if(b<a){a=b;m=2;}
  if(withGlass){ float g=dGlass(p); if(g<a){a=g;m=3;} }
  return a;
}
vec3 nrm(vec3 p,bool wg){int m;vec2 e=vec2(.002,0.);return normalize(vec3(
  map(p+e.xyy,wg,m)-map(p-e.xyy,wg,m),map(p+e.yxy,wg,m)-map(p-e.yxy,wg,m),map(p+e.yyx,wg,m)-map(p-e.yyx,wg,m)));}

vec3 bg(vec3 rd, vec2 uv){
  vec3 c=mix(vec3(.02,.012,.008),vec3(.10,.055,.03),smoothstep(-.6,.8,rd.y)*.6+.2);
  // soft warm bokeh
  for(int i=0;i<7;i++){ float fi=float(i); vec2 o=vec2(h1(vec2(fi,1.))*2.-1., h1(vec2(fi,7.))*2.-1.)*vec2(.6,1.);
    float r=.10+.10*h1(vec2(fi,3.)); float d=length(uv-o);
    c+=vec3(1.,.62,.28)*.10*smoothstep(r,r*.75,d); }
  return c;
}
vec3 env(vec3 r){ return vec3(1.,.9,.75)*(pow(max(dot(r,normalize(vec3(.5,.6,-.6))),0.),24.)*2.2 + pow(max(dot(r,normalize(vec3(-.6,.3,-.7))),0.),40.)*1.0) + vec3(.25,.15,.08)*(.5+.5*r.y); }

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y*2.;
  vec3 ww=normalize(camT-camP), uu=normalize(cross(vec3(0,1,0),ww)), vv=cross(ww,uu);
  vec3 rd=normalize(uv.x*uu+uv.y*vv+1.7*ww);
  vec3 ro=camP;
  vec3 col=vec3(0.); vec3 trans=vec3(1.);
  float t=0.; bool wg=true; float glassSkip=-1.;
  vec3 L=normalize(vec3(.55,.6,-.6));
  bool done=false;
  for(int i=0;i<150;i++){
    vec3 p=ro+rd*t; int m; bool useG = t>glassSkip;
    float d=map(p,useG,m);
    if(d<.0015*max(t,1.)){
      vec3 n=nrm(p,useG);
      float fr=pow(1.-max(dot(n,-rd),0.),4.);
      if(m==3){ // glass: reflect + tint, continue through
        vec3 rf=reflect(rd,n);
        col+=trans*(env(rf)*(.10+.9*fr) + pow(max(dot(rf,L),0.),80.)*1.5);
        vec3 q=gLocal(p); float gold=smoothstep(-.55,-.5,q.y)*(1.-smoothstep(-.28,-.23,q.y));
        col+=trans*gold*vec3(.95,.70,.25)*(.35+.9*max(dot(n,L),0.)+env(rf)*.6);
        trans*= mix(vec3(.90,.92,.92),vec3(.15,.1,.05),gold);
        glassSkip=t+.22; t+=.02; continue;
      }
      vec3 alb; float sp; float sss;
      if(m==1){
        float lip=smoothstep(.22,.0,min(dUp(p),dLo(p)));
        vec3 skin=vec3(.78,.52,.40)*(.92+.16*fbm(p.xy*3.));
        vec3 lipc=mix(vec3(.62,.18,.20),vec3(.78,.30,.32),fbm(p.xy*14.+vec2(p.x*30.,0.)));
        alb=mix(skin,lipc,lip); sp=mix(.12,.45,lip); sss=.35;
      } else { // tea
        alb=vec3(.45,.13,.02); sp=.6; sss=.9;
      }
      float dif=max(dot(n,L),0.);
      float bk=max(dot(n,normalize(vec3(-.6,.2,-.5))),0.);
      vec3 h=normalize(L-rd); float spec=pow(max(dot(n,h),0.),m==2?120.:30.)*sp*1.4;
      vec3 c=alb*(.12+1.0*dif*vec3(1.,.9,.8)+.35*bk*vec3(.7,.8,1.)) + spec;
      c+=alb*sss*vec3(1.,.35,.15)*.25*(1.-dif);          // subsurface warmth
      if(m==2) c+=vec3(.9,.42,.08)*.22*(1.-fr) + env(reflect(rd,n))*fr*.8;
      int mm; float ao=clamp(map(p+n*.25,useG,mm)/.25,0.,1.); c*=.55+.45*ao;
      col+=trans*c; done=true; break;
    }
    t+=d; if(t>80.) break;
  }
  if(!done) col+=trans*bg(rd,uv);
  float vg=1.-.35*dot(uv*vec2(.9,.55),uv*vec2(.9,.55)); col*=vg;
  col=col/(1.+col*.35); col=pow(col,vec3(.92));
  col+=(h1(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)*.025;
  gl_FragColor=vec4(col,1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));return s;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const la=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);

const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,u)=>a+(b-a)*u;
const LIP_Y=-1.0, LIP_Z=-0.55;          // bottom-front of lower lip
function renderFrame(fr){
  const sec=fr/FPS, u=Math.min(1,sec/DUR), e=ease(u);
  // glass rises toward the lower lip: gap from ~12 cm down to 3 cm
  const gap=lerp(9,1.1,ease(Math.min(1,sec/(DUR*0.95))));
  const tilt=lerp(0.05,0.30,e);
  const rTop=2.3;
  // rim near edge sits `gap` below the lower lip
  const nearY=LIP_Y-gap, nearZ=LIP_Z-0.4;
  const gC=[0, nearY + Math.sin(tilt)*rTop, nearZ - Math.cos(tilt)*rTop];
  const G=[0,(LIP_Y+nearY)/2-0.15, LIP_Z-0.7];           // point between lip and rim
  // camera: wide 3/4 shot -> close in the gap
  const az=lerp(0.75,1.22,e), dist=lerp(15,1.45,e), el=lerp(0.06,0.0,e);
  const tgt=[lerp(0,G[0],e), lerp(-2.6,G[1],e), lerp(-1.6,G[2],e)];
  const cam=[tgt[0]+Math.sin(az)*dist*Math.cos(el), tgt[1]+Math.sin(el)*dist, tgt[2]-Math.cos(az)*dist*Math.cos(el)];
  gl.viewport(0,0,432,768);
  gl.uniform2f(U('R'),432,768); gl.uniform1f(U('uT'),sec);
  gl.uniform3fv(U('camP'),cam); gl.uniform3fv(U('camT'),tgt);
  gl.uniform3fv(U('gC'),gC); gl.uniform1f(U('gA'),-tilt);
  gl.drawArrays(gl.TRIANGLES,0,3); gl.finish();
  return true;
}
window.renderFrame=renderFrame; window.NFRAMES=NFRAMES;
document.fonts.ready.then(()=>{ renderFrame(0); window.ready=true; });
</script>
</body>
</html>
